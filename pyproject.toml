[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crapcheck"
version = "0.1.0"
description = "A Python command-line implementation of the CRAP metric."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Dedekind Cut Labs LLC" },
]
keywords = ["code-quality", "coverage", "crap-metric", "cyclomatic-complexity"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Dedekind-Cut-Labs-LLC/crapcheck"
Issues = "https://github.com/Dedekind-Cut-Labs-LLC/crapcheck/issues"
Repository = "https://github.com/Dedekind-Cut-Labs-LLC/crapcheck"

[project.scripts]
crapcheck = "crapcheck.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crapcheck"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
